<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나에게 맞는 커피 원두는? ☕</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700&family=Playfair+Display:wght@600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --coffee-dark: #3E2723;
            --coffee-medium: #6D4C41;
            --coffee-light: #A1887F;
            --crema-gold: #D4A574;
            --cream: #EFEBE9;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><defs><radialGradient id="bean" cx="40%" cy="40%"><stop offset="0%" style="stop-color:%233E2723"/><stop offset="50%" style="stop-color:%236D4C41"/><stop offset="100%" style="stop-color:%232C1810"/></radialGradient></defs><ellipse cx="16" cy="16" rx="10" ry="14" fill="url(%23bean)"/><path d="M 16 6 Q 18 16 16 26" stroke="%23D7CCC8" stroke-width="1.5" fill="none" opacity="0.6"/><ellipse cx="12" cy="10" rx="2" ry="3" fill="%234A352F" opacity="0.4"/></svg>'), auto;
        }

        /* 크레마 배경 */
        .crema-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(212, 165, 116, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(200, 150, 100, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(230, 190, 140, 0.2) 0%, transparent 70%),
                linear-gradient(135deg, #E8D4B8 0%, #D4B896 30%, #C8A882 60%, #B89968 100%);
            z-index: 0;
        }

        /* SVG 필터 정의 */
        .crema-filter {
            position: absolute;
            width: 0;
            height: 0;
        }

        /* 크레마 전환 오버레이 */
        .transition-crema {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
        }

        .transition-crema::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300vmax;
            height: 300vmax;
            transform: translate(-50%, -50%) scale(0);
            border-radius: 50%;
            background: 
                radial-gradient(circle at 35% 35%, 
                    rgba(255, 253, 240, 0.98) 0%,
                    rgba(240, 220, 190, 0.95) 10%,
                    rgba(220, 190, 160, 0.9) 20%,
                    rgba(200, 170, 130, 0.85) 35%,
                    rgba(180, 150, 110, 0.75) 50%,
                    rgba(160, 130, 90, 0.6) 65%,
                    rgba(140, 110, 70, 0.4) 80%,
                    rgba(120, 90, 50, 0.2) 90%,
                    transparent 100%);
            box-shadow: 
                0 0 80px rgba(212, 165, 116, 0.8),
                0 0 150px rgba(200, 160, 120, 0.6),
                inset 0 0 100px rgba(255, 250, 235, 0.5);
            filter: url(#crema-turbulence) blur(2px) contrast(1.2);
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .transition-crema.active {
            opacity: 1;
        }

        .transition-crema.active::before {
            transform: translate(-50%, -50%) scale(1);
        }

        /* 컨테이너 */
        .container {
            position: relative;
            z-index: 10;
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 시작 화면 */
        .start-screen {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: var(--coffee-dark);
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            font-size: 1.3rem;
            color: var(--coffee-medium);
            margin-bottom: 40px;
            font-weight: 300;
        }

        /* 버튼 */
        .btn {
            padding: 18px 50px;
            font-size: 1.2rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--coffee-dark), var(--coffee-medium));
            color: white;
            border: none;
            border-radius: 50px;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><defs><radialGradient id="bean" cx="40%" cy="40%"><stop offset="0%" style="stop-color:%233E2723"/><stop offset="50%" style="stop-color:%236D4C41"/><stop offset="100%" style="stop-color:%232C1810"/></radialGradient></defs><ellipse cx="16" cy="16" rx="10" ry="14" fill="url(%23bean)"/><path d="M 16 6 Q 18 16 16 26" stroke="%23D7CCC8" stroke-width="1.5" fill="none" opacity="0.6"/></svg>'), pointer;
            box-shadow: 0 8px 30px rgba(62, 39, 35, 0.3);
            transition: all 0.3s ease;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(62, 39, 35, 0.4);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        /* 프로그레스 바 */
        .progress-bar {
            width: 100%;
            height: 12px;
            background: rgba(161, 136, 127, 0.3);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--crema-gold), var(--coffee-medium));
            border-radius: 10px;
            transition: width 0.5s ease;
            box-shadow: 0 0 15px rgba(212, 165, 116, 0.5);
        }

        .progress-text {
            text-align: center;
            font-size: 1.1rem;
            color: var(--coffee-medium);
            font-weight: 600;
            margin-bottom: 30px;
        }

        /* 질문 카드 */
        .quiz-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question {
            font-size: 1.6rem;
            color: var(--coffee-dark);
            font-weight: 600;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* 선택지 */
        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option {
            background: rgba(239, 235, 233, 0.8);
            border: 3px solid transparent;
            border-radius: 20px;
            padding: 20px 30px;
            font-size: 1.1rem;
            color: var(--coffee-dark);
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><defs><radialGradient id="bean" cx="40%" cy="40%"><stop offset="0%" style="stop-color:%233E2723"/><stop offset="50%" style="stop-color:%236D4C41"/><stop offset="100%" style="stop-color:%232C1810"/></radialGradient></defs><ellipse cx="16" cy="16" rx="10" ry="14" fill="url(%23bean)"/><path d="M 16 6 Q 18 16 16 26" stroke="%23D7CCC8" stroke-width="1.5" fill="none" opacity="0.6"/></svg>'), pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            text-align: left;
        }

        .option:hover {
            background: rgba(239, 235, 233, 1);
            border-color: var(--crema-gold);
            transform: translateX(10px);
            box-shadow: 0 5px 20px rgba(212, 165, 116, 0.3);
        }

        /* 결과 화면 */
        .result-screen {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        .result-icon {
            font-size: 5rem;
            margin-bottom: 20px;
        }

        .result-name {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--coffee-dark);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .result-roasting {
            font-size: 1.1rem;
            color: var(--coffee-medium);
            margin-bottom: 20px;
        }

        .result-catchphrase {
            font-size: 1.4rem;
            color: var(--coffee-medium);
            font-weight: 600;
            font-style: italic;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .result-details {
            text-align: left;
            background: rgba(239, 235, 233, 0.6);
            border-radius: 20px;
            padding: 30px;
            margin: 30px 0;
        }

        .detail-item {
            margin-bottom: 20px;
        }

        .detail-label {
            font-weight: 700;
            color: var(--coffee-dark);
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .detail-text {
            color: var(--coffee-medium);
            line-height: 1.7;
            font-size: 1rem;
        }

        /* 히든 */
        .hidden {
            display: none;
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
            }

            .question {
                font-size: 1.3rem;
            }

            .quiz-card, .result-screen, .start-screen {
                padding: 40px 25px;
            }

            .btn {
                padding: 15px 40px;
                font-size: 1.1rem;
            }

            .option {
                padding: 18px 25px;
                font-size: 1rem;
            }

            .result-name {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- 크레마 배경 -->
    <div class="crema-bg"></div>

    <!-- SVG 필터 -->
    <svg class="crema-filter">
        <defs>
            <filter id="crema-turbulence">
                <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" result="turbulence"/>
                <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="15" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
        </defs>
    </svg>

    <!-- 전환 오버레이 -->
    <div class="transition-crema" id="transitionCrema"></div>

    <div class="container">
        <!-- 시작 화면 -->
        <div class="start-screen" id="startScreen">
            <div class="title">☕</div>
            <div class="title">나에게 맞는<br>커피 원두는?</div>
            <div class="subtitle">5가지 질문으로 알아보는 나의 커피 취향</div>
            <button class="btn" onclick="startQuiz()">테스트 시작</button>
        </div>

        <!-- 퀴즈 영역 -->
        <div class="hidden" id="quizArea">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">1 / 5</div>

            <div class="quiz-card">
                <div class="question" id="question"></div>
                <div class="options" id="options"></div>
            </div>
        </div>

        <!-- 결과 화면 -->
        <div class="hidden" id="resultArea"></div>
    </div>

    <script>
        // 퀴즈 데이터
        const questions = [
            {
                q: "아침에 눈뜨자마자 나는?",
                options: [
                    { text: "상쾌한 알람 소리에 벌떡 일어나 창문부터 연다", value: "A" },
                    { text: "커피 내리는 루틴부터 차분히 시작한다", value: "B" },
                    { text: "알람을 여러 번 미루다 묵직하게 일어난다", value: "C" },
                    { text: "그날 기분 따라 완전히 다르게 시작한다", value: "D" },
                    { text: "따뜻한 이불 속에서 천천히 부드럽게 깨어난다", value: "E" }
                ]
            },
            {
                q: "끌리는 디저트는?",
                options: [
                    { text: "상큼한 레몬 타르트, 과일 타르트", value: "A" },
                    { text: "캐러멜 마키아토, 견과류 쿠키", value: "B" },
                    { text: "다크 초콜릿, 티라미수", value: "C" },
                    { text: "치즈 플래터, 베리류 (와인 안주 느낌)", value: "D" },
                    { text: "부드러운 카스텔라, 초콜릿 브라우니", value: "E" }
                ]
            },
            {
                q: "스트레스 받을 때 나는?",
                options: [
                    { text: "밖에 나가 상쾌한 공기를 마신다", value: "A" },
                    { text: "할 일 목록을 정리하며 차분히 해결한다", value: "B" },
                    { text: "혼자 조용한 공간에서 묵묵히 견딘다", value: "C" },
                    { text: "새로운 자극(여행, 새 취미)을 찾는다", value: "D" },
                    { text: "편안한 사람과 수다 떨며 푼다", value: "E" }
                ]
            },
            {
                q: "끌리는 여행지는?",
                options: [
                    { text: "지중해 해변 마을", value: "A" },
                    { text: "유럽의 고전적인 도시", value: "B" },
                    { text: "깊은 숲속 오두막", value: "C" },
                    { text: "이국적인 시장이 있는 낯선 나라", value: "D" },
                    { text: "한적한 바닷가 리조트", value: "E" }
                ]
            },
            {
                q: "나를 표현하는 계절은?",
                options: [
                    { text: "봄", value: "A" },
                    { text: "가을", value: "B" },
                    { text: "겨울", value: "C" },
                    { text: "환절기 (변화무쌍)", value: "D" },
                    { text: "초여름", value: "E" }
                ]
            }
        ];

        // 결과 데이터
        const results = {
            A: {
                icon: "🌸",
                name: "에티오피아 예가체프",
                roasting: "라이트~미디엄 로스팅",
                catchphrase: "화사한 첫인상, 계속 생각나는 산뜻함",
                taste: "자스민·베르가못 향, 밝은 산미, 홍차 같은 가벼운 바디",
                recommend: "핸드드립 추천, 상쾌한 아침에 잘 어울림"
            },
            B: {
                icon: "🌰",
                name: "콜롬비아 수프리모",
                roasting: "미디엄 로스팅",
                catchphrase: "무난한 매력, 매일 곁에 두고 싶은 밸런스",
                taste: "캐러멜·견과류, 부드러운 산미와 균형 잡힌 바디",
                recommend: "어떤 추출법에도 무난한 데일리 커피"
            },
            C: {
                icon: "🌿",
                name: "인도네시아 만델링(수마트라)",
                roasting: "미디엄다크~다크 로스팅",
                catchphrase: "깊고 진한 존재감, 잔잔하지만 강렬한",
                taste: "흙내음·스모키·허브 향, 묵직한 바디, 낮은 산미",
                recommend: "에스프레소나 밀크 베이스 음료로 추천"
            },
            D: {
                icon: "🍇",
                name: "케냐 AA",
                roasting: "미디엄 로스팅",
                catchphrase: "예측불가 매력, 마실 때마다 새로운 얼굴",
                taste: "블랙커런트·와인 같은 산미, 복합적인 풍미",
                recommend: "핸드드립으로 개성 강한 한 잔을 원할 때 추천"
            },
            E: {
                icon: "🍫",
                name: "브라질 산토스",
                roasting: "미디엄 로스팅",
                catchphrase: "부드럽고 편안한, 언제 마셔도 좋은 친구",
                taste: "초콜릿·고소한 견과류, 낮은 산미, 부드러운 목넘김",
                recommend: "라떼나 카페오레 등 순한 커피 선호자에게 추천"
            }
        };

        // 상태
        let currentQ = 0;
        let answers = [];

        // 퀴즈 시작
        function startQuiz() {
            triggerCremaTransition(() => {
                document.getElementById('startScreen').classList.add('hidden');
                document.getElementById('quizArea').classList.remove('hidden');
                showQuestion();
            });
        }

        // 질문 표시
        function showQuestion() {
            const q = questions[currentQ];
            document.getElementById('question').textContent = q.q;
            
            const optionsHtml = q.options.map(opt => 
                `<div class="option" onclick="selectOption('${opt.value}')">${opt.text}</div>`
            ).join('');
            document.getElementById('options').innerHTML = optionsHtml;

            updateProgress();
        }

        // 선택
        function selectOption(value) {
            answers.push(value);

            if (currentQ < questions.length - 1) {
                triggerCremaTransition(() => {
                    currentQ++;
                    showQuestion();
                });
            } else {
                // 결과 계산
                triggerCremaTransition(() => {
                    showResult();
                });
            }
        }

        // 프로그레스 업데이트
        function updateProgress() {
            const progress = ((currentQ + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = `${currentQ + 1} / ${questions.length}`;
        }

        // 결과 계산
        function calculateResult() {
            const count = {};
            answers.forEach(ans => {
                count[ans] = (count[ans] || 0) + 1;
            });

            let maxCount = 0;
            let resultType = answers[answers.length - 1]; // 동점 시 마지막 답변

            for (let type in count) {
                if (count[type] > maxCount) {
                    maxCount = count[type];
                    resultType = type;
                }
            }

            return resultType;
        }

        // 결과 표시
        function showResult() {
            const resultType = calculateResult();
            const result = results[resultType];

            const html = `
                <div class="result-screen">
                    <div class="result-icon">${result.icon}</div>
                    <div class="result-name">${result.name}</div>
                    <div class="result-roasting">${result.roasting}</div>
                    <div class="result-catchphrase">"${result.catchphrase}"</div>
                    
                    <div class="result-details">
                        <div class="detail-item">
                            <div class="detail-label">☕ 맛 특징</div>
                            <div class="detail-text">${result.taste}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">💡 추천</div>
                            <div class="detail-text">${result.recommend}</div>
                        </div>
                    </div>

                    <button class="btn" onclick="restart()">다시 테스트하기</button>
                </div>
            `;

            document.getElementById('quizArea').classList.add('hidden');
            document.getElementById('resultArea').innerHTML = html;
            document.getElementById('resultArea').classList.remove('hidden');
        }

        // 재시작
        function restart() {
            triggerCremaTransition(() => {
                currentQ = 0;
                answers = [];
                document.getElementById('resultArea').classList.add('hidden');
                document.getElementById('startScreen').classList.remove('hidden');
            });
        }

        // 크레마 전환 효과
        function triggerCremaTransition(callback) {
            const overlay = document.getElementById('transitionCrema');
            overlay.classList.add('active');

            setTimeout(() => {
                if (callback) callback();
            }, 500);

            setTimeout(() => {
                overlay.classList.remove('active');
            }, 1000);
        }
    </script>
</body>
</html>
