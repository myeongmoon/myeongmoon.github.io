<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧔 BEARD STUDIO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1e1e2e;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, #2d2d44 0%, #1e1e2e 100%);
        }

        .header h1 {
            font-size: 2.5rem;
            color: #ff9052;
            margin-bottom: 10px;
        }

        .header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .main-container {
            display: flex;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            gap: 20px;
            flex: 1;
        }

        /* 카메라 영역 */
        .camera-section {
            flex: 1;
            background: #2d3748;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .status-bar {
            background: #4ade80;
            color: #1e1e2e;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .status-bar.info {
            background: #60a5fa;
        }

        .status-bar.error {
            background: #ef4444;
            color: white;
        }

        .camera-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        #video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff9052, #ff6b35);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 144, 82, 0.3);
        }

        .btn-secondary {
            background: #4c7cdb;
            color: white;
        }

        .btn-secondary:hover {
            background: #3b6ac9;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 사이드바 */
        .sidebar {
            width: 350px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            background: #2d3748;
            border-radius: 15px;
            padding: 20px;
        }

        .panel h3 {
            color: #ff9052;
            font-size: 1.3rem;
            margin-bottom: 15px;
        }

        /* 수염 스타일 그리드 */
        .beard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-height: 500px;
            overflow-y: auto;
        }

        .beard-item {
            background: #1e293b;
            border: 3px solid transparent;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .beard-item:hover {
            border-color: #ff9052;
            transform: scale(1.05);
        }

        .beard-item.active {
            border-color: #ff6b35;
            background: linear-gradient(135deg, rgba(255,144,82,0.2), rgba(255,107,53,0.1));
        }

        .beard-emoji {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }

        .beard-label {
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        /* 슬라이더 */
        .slider-group {
            margin-bottom: 20px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #cbd5e1;
        }

        .slider-value {
            color: #ff9052;
            font-weight: 700;
        }

        .slider {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #1e293b;
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff9052, #ff6b35);
            cursor: pointer;
        }

        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff9052, #ff6b35);
            cursor: pointer;
            border: none;
        }

        /* 반응형 */
        @media (max-width: 1024px) {
            .main-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- 헤더 -->
    <div class="header">
        <h1>🧔 BEARD STUDIO</h1>
        <p>실시간 얼굴 인식으로 나만의 수염 스타일 찾기</p>
    </div>

    <!-- 메인 컨테이너 -->
    <div class="main-container">
        <!-- 카메라 섹션 -->
        <div class="camera-section">
            <div id="status" class="status-bar info">
                ✅ 얼굴을 인식중... 수염이 나타날 때까지 잠시만 기다려주세요!
            </div>

            <div class="camera-wrapper">
                <video id="video" playsinline autoplay></video>
                <canvas id="canvas"></canvas>
            </div>

            <div class="controls">
                <button class="btn btn-primary" id="startBtn" onclick="startCamera()">
                    📹 카메라 시작
                </button>
                <button class="btn btn-secondary" id="captureBtn" onclick="capturePhoto()" disabled>
                    📸 사진 촬영
                </button>
            </div>
        </div>

        <!-- 사이드바 -->
        <div class="sidebar">
            <!-- 수염 스타일 -->
            <div class="panel">
                <h3>🎭 수염 스타일</h3>
                <div class="beard-grid">
                    <div class="beard-item active" data-style="full" onclick="selectBeard('full')">
                        <div class="beard-emoji">🧔</div>
                        <div class="beard-label">풀 비어드</div>
                    </div>
                    <div class="beard-item" data-style="goatee" onclick="selectBeard('goatee')">
                        <div class="beard-emoji">🧔‍♂️</div>
                        <div class="beard-label">염소수염</div>
                    </div>
                    <div class="beard-item" data-style="mustache" onclick="selectBeard('mustache')">
                        <div class="beard-emoji">👨</div>
                        <div class="beard-label">콧수염</div>
                    </div>
                    <div class="beard-item" data-style="van-dyke" onclick="selectBeard('van-dyke')">
                        <div class="beard-emoji">🎩</div>
                        <div class="beard-label">반 다이크</div>
                    </div>
                    <div class="beard-item" data-style="stubble" onclick="selectBeard('stubble')">
                        <div class="beard-emoji">😎</div>
                        <div class="beard-label">무정발</div>
                    </div>
                    <div class="beard-item" data-style="chinstrap" onclick="selectBeard('chinstrap')">
                        <div class="beard-emoji">💼</div>
                        <div class="beard-label">턱 스트랩</div>
                    </div>
                    <div class="beard-item" data-style="balbo" onclick="selectBeard('balbo')">
                        <div class="beard-emoji">🎯</div>
                        <div class="beard-label">발보</div>
                    </div>
                    <div class="beard-item" data-style="handlebar" onclick="selectBeard('handlebar')">
                        <div class="beard-emoji">🥸</div>
                        <div class="beard-label">핸들바</div>
                    </div>
                    <div class="beard-item" data-style="anchor" onclick="selectBeard('anchor')">
                        <div class="beard-emoji">⚓</div>
                        <div class="beard-label">앵커</div>
                    </div>
                    <div class="beard-item" data-style="garibaldi" onclick="selectBeard('garibaldi')">
                        <div class="beard-emoji">🦁</div>
                        <div class="beard-label">가리발디</div>
                    </div>
                </div>
            </div>

            <!-- 세부 조정 -->
            <div class="panel">
                <h3>⚙️ 세부 조정</h3>
                
                <div class="slider-group">
                    <div class="slider-label">
                        <span>색상 (밝음 ← → 어두움)</span>
                        <span class="slider-value" id="colorValue">50%</span>
                    </div>
                    <input type="range" class="slider" id="colorSlider" min="0" max="100" value="50" 
                           oninput="updateColor(this.value)">
                </div>

                <div class="slider-group">
                    <div class="slider-label">
                        <span>투명도</span>
                        <span class="slider-value" id="opacityValue">80%</span>
                    </div>
                    <input type="range" class="slider" id="opacitySlider" min="0" max="100" value="80" 
                           oninput="updateOpacity(this.value)">
                </div>

                <div class="slider-group">
                    <div class="slider-label">
                        <span>두께</span>
                        <span class="slider-value" id="thicknessValue">100%</span>
                    </div>
                    <input type="range" class="slider" id="thicknessSlider" min="50" max="150" value="100" 
                           oninput="updateThickness(this.value)">
                </div>
            </div>
        </div>
    </div>

    <!-- TensorFlow.js & FaceMesh -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection"></script>

    <script>
        // 전역 변수
        let video, canvas, ctx;
        let detector;
        let isRunning = false;
        let currentBeard = 'full';
        let beardColor = 0.5;
        let beardOpacity = 0.8;
        let beardThickness = 1.0;

        // 초기화
        function init() {
            video = document.getElementById('video');
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            console.log('✅ 초기화 완료');
        }

        // 스타일 선택
        function selectBeard(style) {
            currentBeard = style;
            document.querySelectorAll('.beard-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`[data-style="${style}"]`).classList.add('active');
            console.log('선택된 스타일:', style);
        }

        // 슬라이더 업데이트
        function updateColor(value) {
            beardColor = value / 100;
            document.getElementById('colorValue').textContent = value + '%';
        }

        function updateOpacity(value) {
            beardOpacity = value / 100;
            document.getElementById('opacityValue').textContent = value + '%';
        }

        function updateThickness(value) {
            beardThickness = value / 100;
            document.getElementById('thicknessValue').textContent = value + '%';
        }

        // 상태 메시지
        function showStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status-bar ' + type;
        }

        // 카메라 시작
        async function startCamera() {
            try {
                showStatus('🔄 카메라 접근중...', 'info');
                
                // 카메라 스트림 가져오기
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        width: 1280, 
                        height: 960,
                        facingMode: 'user'
                    }
                });
                
                video.srcObject = stream;
                
                video.onloadedmetadata = async () => {
                    // 캔버스 크기 설정
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    showStatus('🔄 얼굴 인식 모델 로딩중...', 'info');
                    
                    // FaceMesh 모델 로드
                    await loadFaceDetector();
                    
                    showStatus('✅ 카메라 실행중! 얼굴을 화면에 맞춰주세요', 'success');
                    
                    // 버튼 상태 변경
                    document.getElementById('startBtn').disabled = true;
                    document.getElementById('captureBtn').disabled = false;
                    
                    // 감지 시작
                    isRunning = true;
                    detectFace();
                };
                
            } catch (error) {
                console.error('카메라 오류:', error);
                showStatus('❌ 카메라 접근 실패! 권한을 확인해주세요', 'error');
            }
        }
        
        // FaceMesh 모델 로드
        async function loadFaceDetector() {
            try {
                const model = faceLandmarksDetection.SupportedModels.MediaPipeFaceMesh;
                const detectorConfig = {
                    runtime: 'mediapipe',
                    solutionPath: 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh',
                    refineLandmarks: true
                };
                
                detector = await faceLandmarksDetection.createDetector(model, detectorConfig);
                console.log('✅ FaceMesh 모델 로드 완료');
                
            } catch (error) {
                console.error('모델 로드 실패:', error);
                showStatus('❌ 얼굴 인식 모델 로드 실패', 'error');
            }
        }
        
        // 얼굴 감지 루프
        async function detectFace() {
            if (!isRunning) return;
            
            try {
                // 얼굴 감지
                const faces = await detector.estimateFaces(video, {
                    flipHorizontal: false
                });
                
                // 캔버스 초기화
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                if (faces && faces.length > 0) {
                    const face = faces[0];
                    const keypoints = face.keypoints;
                    
                    // 선택된 수염 스타일 그리기
                    drawBeardStyle(keypoints, currentBeard);
                    
                    // 디버깅 모드 (주석 처리)
                    // drawFaceDebug(keypoints);
                }
                
            } catch (error) {
                console.error('감지 오류:', error);
            }
            
            requestAnimationFrame(detectFace);
        }
        
        // 디버그: 얼굴 포인트 표시
        function drawFaceDebug(keypoints) {
            // 모든 keypoints를 작은 점으로 표시
            ctx.fillStyle = 'rgba(0, 255, 0, 0.5)';
            keypoints.forEach((point, idx) => {
                ctx.beginPath();
                ctx.arc(point.x, point.y, 2, 0, Math.PI * 2);
                ctx.fill();
                
                // 중요 포인트에 번호 표시 (턱선)
                const jawPoints = [127, 162, 234, 93, 132, 58, 172, 136, 150, 149, 176, 148, 152, 377, 400, 378, 379, 365, 397, 288, 361, 323, 454, 356];
                if (jawPoints.includes(idx)) {
                    ctx.fillStyle = 'red';
                    ctx.font = '10px Arial';
                    ctx.fillText(idx, point.x + 5, point.y - 5);
                }
            });
        }
        
        // 수염 스타일 그리기 (메인 함수)
        function drawBeardStyle(keypoints, style) {
            // 색상 계산 (밝음 ← → 어두움)
            const brightness = Math.floor(255 * (1 - beardColor));
            const r = brightness;
            const g = Math.floor(brightness * 0.7);
            const b = Math.floor(brightness * 0.4);
            
            switch(style) {
                case 'full':
                    drawFullBeard(keypoints, r, g, b);
                    break;
                case 'goatee':
                    drawGoatee(keypoints, r, g, b);
                    break;
                case 'mustache':
                    drawMustache(keypoints, r, g, b);
                    break;
                case 'van-dyke':
                    drawVanDyke(keypoints, r, g, b);
                    break;
                case 'stubble':
                    drawStubble(keypoints, r, g, b);
                    break;
                case 'chinstrap':
                    drawChinstrap(keypoints, r, g, b);
                    break;
                case 'balbo':
                    drawBalbo(keypoints, r, g, b);
                    break;
                case 'handlebar':
                    drawHandlebar(keypoints, r, g, b);
                    break;
                case 'anchor':
                    drawAnchor(keypoints, r, g, b);
                    break;
                case 'garibaldi':
                    drawGaribaldi(keypoints, r, g, b);
                    break;
            }
        }
        
        // 풀 비어드 (Full Beard)
        function drawFullBeard(keypoints, r, g, b) {
            // 턱선 전체 포인트
            const jawLine = [
                // 왼쪽 턱선
                127, 162, 234, 93, 132, 58, 172, 136, 150,
                // 턱 중앙
                149, 176, 148, 152,
                // 오른쪽 턱선
                377, 400, 378, 379, 365, 397, 288, 361, 323, 454, 356
            ];
            
            // 입 주변 포인트 (콧수염 영역)
            const upperLipArea = [
                // 왼쪽 콧수염
                50, 101, 36, 205, 206,
                // 코 아래
                4, 5, 195,
                // 오른쪽 콧수염
                429, 430, 266, 330, 280
            ];
            
            // 턱수염 그리기
            drawBeardArea(keypoints, jawLine, r, g, b, 0.7);
            
            // 콧수염 그리기
            drawBeardArea(keypoints, upperLipArea, r, g, b, 0.6);
            
            // 볼 양쪽 연결 (더 자연스럽게)
            drawCheekConnection(keypoints, r, g, b);
        }
        
        // 수염 영역 그리기 (기본)
        function drawBeardArea(keypoints, indices, r, g, b, density = 0.6) {
            ctx.save();
            
            // 패스 생성
            ctx.beginPath();
            
            indices.forEach((idx, i) => {
                const point = keypoints[idx];
                if (!point) return;
                
                if (i === 0) {
                    ctx.moveTo(point.x, point.y);
                } else {
                    ctx.lineTo(point.x, point.y);
                }
            });
            
            ctx.closePath();
            
            // 수염 색상과 텍스처
            ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${beardOpacity * density})`;
            ctx.fill();
            
            // 테두리 (더 진하게)
            ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${beardOpacity * 0.8})`;
            ctx.lineWidth = 2 * beardThickness;
            ctx.stroke();
            
            ctx.restore();
        }
        
        // 볼 연결 (더 자연스러운 수염)
        function drawCheekConnection(keypoints, r, g, b) {
            // 왼쪽 볼
            const leftCheek = [234, 93, 132, 58, 172, 136, 205, 206];
            // 오른쪽 볼
            const rightCheek = [454, 323, 361, 288, 397, 365, 429, 430];
            
            drawBeardArea(keypoints, leftCheek, r, g, b, 0.5);
            drawBeardArea(keypoints, rightCheek, r, g, b, 0.5);
        }
        
        // 염소수염 (Goatee) - 턱 중앙만
        function drawGoatee(keypoints, r, g, b) {
            // 턱 중앙 영역
            const chinArea = [
                149, 176, 148, 152, 377, 400, 378, 
                // 입 아래 연결
                164, 167, 165, 92, 186, 149
            ];
            
            // Soul patch (입 바로 아래)
            const soulPatch = [
                164, 167, 165, 92, 164
            ];
            
            drawBeardArea(keypoints, chinArea, r, g, b, 0.7);
            drawBeardArea(keypoints, soulPatch, r, g, b, 0.8);
        }
        
        // 콧수염 (Mustache) - 입 위만
        function drawMustache(keypoints, r, g, b) {
            // 콧수염 영역
            const mustacheArea = [
                // 왼쪽
                50, 101, 36, 205, 206,
                // 중앙 (코 아래)
                4, 5, 195,
                // 오른쪽
                429, 430, 266, 330, 280,
                // 입 위 연결
                61, 185, 40, 39, 37, 0, 267, 269, 270, 409, 291, 50
            ];
            
            drawBeardArea(keypoints, mustacheArea, r, g, b, 0.8);
        }
        
        // 반 다이크 (Van Dyke) - 콧수염 + 염소수염
        function drawVanDyke(keypoints, r, g, b) {
            // 콧수염
            drawMustache(keypoints, r, g, b);
            
            // 염소수염 (조금 더 포인티하게)
            const vanDykeChin = [
                149, 176, 148, 152, 377, 400, 378,
                164, 167, 165, 92, 149
            ];
            
            drawBeardArea(keypoints, vanDykeChin, r, g, b, 0.7);
        }
        
        // 무정발 (Stubble) - 얇고 짧은 수염
        function drawStubble(keypoints, r, g, b) {
            // 턱선 전체
            const jawLine = [
                127, 162, 234, 93, 132, 58, 172, 136, 150,
                149, 176, 148, 152,
                377, 400, 378, 379, 365, 397, 288, 361, 323, 454, 356
            ];
            
            // 얇고 투명하게
            const oldOpacity = beardOpacity;
            beardOpacity *= 0.4;
            
            drawBeardArea(keypoints, jawLine, r, g, b, 0.3);
            
            // 점 무늬로 텍스처 추가
            ctx.save();
            ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${oldOpacity * 0.3})`;
            
            jawLine.forEach(idx => {
                const point = keypoints[idx];
                if (!point) return;
                
                // 랜덤 점들
                for (let i = 0; i < 10; i++) {
                    const offsetX = (Math.random() - 0.5) * 20;
                    const offsetY = (Math.random() - 0.5) * 20;
                    ctx.beginPath();
                    ctx.arc(point.x + offsetX, point.y + offsetY, 1, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            
            ctx.restore();
            beardOpacity = oldOpacity;
        }
        
        // 턱 스트랩 (Chinstrap) - 턱선만 따라가는 라인
        function drawChinstrap(keypoints, r, g, b) {
            // 턱선 라인
            const jawLineOnly = [
                127, 162, 234, 93, 132, 58, 172, 136, 150, 149, 176, 148, 152,
                377, 400, 378, 379, 365, 397, 288, 361, 323, 454, 356, 127
            ];
            
            ctx.save();
            ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${beardOpacity})`;
            ctx.lineWidth = 8 * beardThickness;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            ctx.beginPath();
            jawLineOnly.forEach((idx, i) => {
                const point = keypoints[idx];
                if (!point) return;
                
                if (i === 0) {
                    ctx.moveTo(point.x, point.y);
                } else {
                    ctx.lineTo(point.x, point.y);
                }
            });
            
            ctx.stroke();
            ctx.restore();
        }
        
        // 발보 (Balbo) - 콧수염 + 턱 패치 (입 주변 제외)
        function drawBalbo(keypoints, r, g, b) {
            // 콧수염
            drawMustache(keypoints, r, g, b);
            
            // 턱 중앙만 (입과 연결 안됨)
            const balboChin = [
                148, 152, 377, 400, 378, 148
            ];
            
            // Soul patch
            const soulArea = [
                164, 167, 165, 92, 164
            ];
            
            drawBeardArea(keypoints, balboChin, r, g, b, 0.7);
            drawBeardArea(keypoints, soulArea, r, g, b, 0.8);
        }
        
        // 핸들바 (Handlebar) - 위로 말린 콧수염
        function drawHandlebar(keypoints, r, g, b) {
            ctx.save();
            ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${beardOpacity})`;
            ctx.lineWidth = 10 * beardThickness;
            ctx.lineCap = 'round';
            
            // 왼쪽 콧수염 (위로 컬)
            const leftPoints = [61, 185, 40, 39, 37, 0];
            ctx.beginPath();
            leftPoints.forEach((idx, i) => {
                const point = keypoints[idx];
                if (!point) return;
                
                if (i === 0) {
                    ctx.moveTo(point.x, point.y);
                } else {
                    // 위로 휘어지게
                    const prevPoint = keypoints[leftPoints[i-1]];
                    const controlX = (point.x + prevPoint.x) / 2 - 10;
                    const controlY = point.y - 15;
                    ctx.quadraticCurveTo(controlX, controlY, point.x, point.y);
                }
            });
            ctx.stroke();
            
            // 오른쪽 콧수염 (위로 컬)
            const rightPoints = [291, 409, 270, 269, 267, 0];
            ctx.beginPath();
            rightPoints.forEach((idx, i) => {
                const point = keypoints[idx];
                if (!point) return;
                
                if (i === 0) {
                    ctx.moveTo(point.x, point.y);
                } else {
                    const prevPoint = keypoints[rightPoints[i-1]];
                    const controlX = (point.x + prevPoint.x) / 2 + 10;
                    const controlY = point.y - 15;
                    ctx.quadraticCurveTo(controlX, controlY, point.x, point.y);
                }
            });
            ctx.stroke();
            
            // 중앙 콧수염 (기본)
            const centerArea = [
                50, 101, 36, 205, 206, 4, 5, 195, 429, 430, 266, 330, 280, 50
            ];
            ctx.restore();
            
            drawBeardArea(keypoints, centerArea, r, g, b, 0.7);
        }
        
        // 앵커 (Anchor) - 앵커 모양 (콧수염 + 세로 라인)
        function drawAnchor(keypoints, r, g, b) {
            // 콧수염
            drawMustache(keypoints, r, g, b);
            
            // Soul patch
            const soulPatch = [
                164, 167, 165, 92, 164
            ];
            
            // 턱으로 내려가는 라인
            ctx.save();
            ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${beardOpacity})`;
            ctx.lineWidth = 6 * beardThickness;
            ctx.lineCap = 'round';
            
            const anchorLine = [92, 186, 61, 146, 91, 181, 84, 17, 314, 405, 321, 375, 291];
            ctx.beginPath();
            anchorLine.forEach((idx, i) => {
                const point = keypoints[idx];
                if (!point) return;
                
                if (i === 0) {
                    ctx.moveTo(point.x, point.y);
                } else {
                    ctx.lineTo(point.x, point.y);
                }
            });
            ctx.stroke();
            ctx.restore();
            
            drawBeardArea(keypoints, soulPatch, r, g, b, 0.8);
        }
        
        // 가리발디 (Garibaldi) - 둥글고 풍성한 수염
        function drawGaribaldi(keypoints, r, g, b) {
            // 풀 비어드보다 더 확장
            const fullJaw = [
                127, 162, 234, 93, 132, 58, 172, 136, 150,
                149, 176, 148, 152,
                377, 400, 378, 379, 365, 397, 288, 361, 323, 454, 356
            ];
            
            const underChin = [
                164, 167, 165, 92, 186, 61, 146, 91, 181, 84, 17, 
                314, 405, 321, 375, 291, 409, 270, 269, 267, 164
            ];
            
            // 더 두껍게
            const oldThickness = beardThickness;
            beardThickness *= 1.3;
            
            drawBeardArea(keypoints, fullJaw, r, g, b, 0.8);
            drawBeardArea(keypoints, underChin, r, g, b, 0.7);
            
            // 콧수염
            const mustacheArea = [
                50, 101, 36, 205, 206, 4, 5, 195, 429, 430, 266, 330, 280, 50
            ];
            drawBeardArea(keypoints, mustacheArea, r, g, b, 0.7);
            
            // 볼 연결
            drawCheekConnection(keypoints, r, g, b);
            
            beardThickness = oldThickness;
        }

        // 사진 촬영
        function capturePhoto() {
            if (!isRunning) {
                showStatus('❌ 카메라를 먼저 시작해주세요!', 'error');
                return;
            }
            
            try {
                // 임시 캔버스 생성
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tempCtx = tempCanvas.getContext('2d');
                
                // 1. 비디오 그리기 (좌우 반전)
                tempCtx.save();
                tempCtx.scale(-1, 1);
                tempCtx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
                tempCtx.restore();
                
                // 2. 수염 레이어 그리기 (좌우 반전)
                tempCtx.save();
                tempCtx.scale(-1, 1);
                tempCtx.drawImage(canvas, -canvas.width, 0);
                tempCtx.restore();
                
                // 3. 이미지로 변환 후 다운로드
                tempCanvas.toBlob(blob => {
                    if (!blob) {
                        showStatus('❌ 사진 생성 실패!', 'error');
                        return;
                    }
                    
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5);
                    link.href = url;
                    link.download = `beard-${currentBeard}-${timestamp}.png`;
                    link.click();
                    
                    // 메모리 정리
                    URL.revokeObjectURL(url);
                    
                    showStatus('✅ 사진이 저장되었습니다!', 'success');
                    
                    // 2초 후 원래 메시지로 복구
                    setTimeout(() => {
                        showStatus('✅ 카메라 실행중! 수염 스타일을 선택하세요', 'success');
                    }, 2000);
                    
                }, 'image/png', 1.0);
                
            } catch (error) {
                console.error('사진 촬영 오류:', error);
                showStatus('❌ 사진 촬영 실패!', 'error');
            }
        }

        // 페이지 로드
        window.onload = init;
    </script>
</body>
