<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 커피 원두 찾기 ☕</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --coffee-dark: #3E2723;
            --coffee-medium: #6D4C41;
            --coffee-light: #A1887F;
            --cream: #EFEBE9;
            --foam: #F5F5F5;
            --accent: #D7CCC8;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, var(--cream) 0%, var(--foam) 100%);
            min-height: 100vh;
            overflow-x: hidden;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><defs><radialGradient id="bean" cx="40%" cy="40%"><stop offset="0%" style="stop-color:%233E2723;stop-opacity:1" /><stop offset="50%" style="stop-color:%236D4C41;stop-opacity:1" /><stop offset="100%" style="stop-color:%232C1810;stop-opacity:1" /></radialGradient></defs><ellipse cx="16" cy="16" rx="10" ry="14" fill="url(%23bean)" /><path d="M 16 6 Q 18 16 16 26" stroke="%23D7CCC8" stroke-width="1.5" fill="none" opacity="0.6"/><ellipse cx="12" cy="10" rx="2" ry="3" fill="%234A352F" opacity="0.4"/><ellipse cx="20" cy="12" rx="1.5" ry="2" fill="%234A352F" opacity="0.3"/></svg>'), auto;
        }

        /* 크레마 거품 배경 */
        .crema-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, 
                rgba(255, 253, 245, 0.95),
                rgba(235, 220, 200, 0.85) 30%,
                rgba(200, 180, 160, 0.7) 60%,
                rgba(180, 150, 120, 0.5));
            box-shadow: 
                inset -5px -5px 15px rgba(180, 150, 120, 0.4),
                inset 5px 5px 10px rgba(255, 255, 255, 0.6),
                0 5px 20px rgba(200, 180, 160, 0.3);
            animation: float-up 8s infinite ease-in-out;
            opacity: 0;
            border: 1px solid rgba(235, 220, 200, 0.6);
        }

        @keyframes float-up {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100px) scale(1.5);
                opacity: 0;
            }
        }

        /* 페이지 전환 효과 - 실제 크레마 생성 효과 */
        .transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .transition-overlay.active {
            opacity: 1;
        }

        /* 크레마 레이어들 */
        .crema-layer {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
        }

        .transition-overlay.active .crema-layer {
            animation: crema-bloom 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes crema-bloom {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0);
            }
            30% {
                opacity: 0.9;
            }
            60% {
                opacity: 0.95;
                transform: translate(-50%, -50%) scale(1.1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.5);
            }
        }

        /* 크레마 중심부 - 진한 갈색 */
        .crema-center {
            width: 40vmin;
            height: 40vmin;
            top: 50%;
            left: 50%;
            background: radial-gradient(circle at 40% 40%,
                #C8A882 0%,
                #B8966E 20%,
                #A08055 40%,
                #8B6F47 60%,
                #75593A 80%,
                transparent 100%);
            filter: blur(15px);
            animation-delay: 0s;
        }

        /* 크레마 중간층 - 황금빛 */
        .crema-middle {
            width: 70vmin;
            height: 70vmin;
            top: 50%;
            left: 50%;
            background: radial-gradient(circle at 45% 45%,
                #E8D4B8 0%,
                #D4BD9C 15%,
                #C0A680 30%,
                #A89070 50%,
                #8B7555 70%,
                transparent 100%);
            filter: blur(25px);
            animation-delay: 0.1s;
        }

        /* 크레마 외곽층 - 밝은 크림 */
        .crema-outer {
            width: 100vmin;
            height: 100vmin;
            top: 50%;
            left: 50%;
            background: radial-gradient(circle at 50% 50%,
                #F5EAD8 0%,
                #E8D8C0 10%,
                #D4C4A8 25%,
                #BDA888 45%,
                #A08C6C 65%,
                transparent 100%);
            filter: blur(35px);
            animation-delay: 0.15s;
        }

        /* 크레마 텍스처 입자들 */
        .crema-particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%,
                rgba(232, 212, 184, 0.8),
                rgba(192, 166, 128, 0.6) 40%,
                transparent 70%);
            opacity: 0;
        }

        .transition-overlay.active .crema-particle {
            animation: particle-float 1.5s ease-out forwards;
        }

        @keyframes particle-float {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.3);
            }
            20% {
                opacity: 0.7;
            }
            70% {
                opacity: 0.5;
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) scale(1.2);
            }
        }

        /* 인트로 페이지 */
        .intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9000;
            background: linear-gradient(135deg, 
                #F5EBE0 0%, 
                #EAD8C8 25%,
                #D4C4B0 50%,
                #C8B8A0 75%,
                #BCA888 100%);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .intro-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 30% 40%, rgba(232, 212, 184, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 70% 60%, rgba(200, 166, 128, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(244, 230, 210, 0.5) 0%, transparent 60%);
            filter: blur(40px);
            animation: intro-crema-float 8s ease-in-out infinite;
        }

        @keyframes intro-crema-float {
            0%, 100% {
                opacity: 0.6;
                transform: scale(1);
            }
            50% {
                opacity: 0.9;
                transform: scale(1.1);
            }
        }

        .intro-screen.hidden {
            opacity: 0;
            transform: scale(1.1);
            pointer-events: none;
        }

        .intro-content {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 60px 50px;
            border-radius: 30px;
            box-shadow: 0 30px 80px rgba(62, 39, 35, 0.3);
            animation: intro-fade-in 1s ease;
        }

        @keyframes intro-fade-in {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .intro-title {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            color: var(--coffee-dark);
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .intro-subtitle {
            font-size: 1.4rem;
            color: var(--coffee-medium);
            margin-bottom: 40px;
            font-weight: 300;
            line-height: 1.6;
        }

        .intro-btn {
            padding: 20px 60px;
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--coffee-dark), var(--coffee-medium));
            color: white;
            border: none;
            border-radius: 50px;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><defs><radialGradient id="bean" cx="40%" cy="40%"><stop offset="0%" style="stop-color:%233E2723;stop-opacity:1" /><stop offset="50%" style="stop-color:%236D4C41;stop-opacity:1" /><stop offset="100%" style="stop-color:%232C1810;stop-opacity:1" /></radialGradient></defs><ellipse cx="16" cy="16" rx="10" ry="14" fill="url(%23bean)" /><path d="M 16 6 Q 18 16 16 26" stroke="%23D7CCC8" stroke-width="1.5" fill="none" opacity="0.6"/></svg>'), pointer;
            box-shadow: 0 10px 40px rgba(62, 39, 35, 0.4);
            transition: all 0.3s ease;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .intro-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 50px rgba(62, 39, 35, 0.5);
        }

        .intro-btn:active {
            transform: translateY(-2px);
        }
            height: 0;
            border-radius: 50%;
            background: radial-gradient(circle at center, 
                rgba(255, 250, 240, 0.98) 0%,
                rgba(245, 230, 210, 0.95) 15%,
                rgba(225, 200, 170, 0.9) 30%,
                rgba(200, 175, 145, 0.85) 45%,
                rgba(180, 155, 125, 0.75) 60%,
                rgba(160, 135, 105, 0.6) 75%,
                rgba(140, 115, 85, 0.4) 85%,
                rgba(120, 95, 65, 0.2) 95%,
                transparent 100%);
            box-shadow: 
                0 0 50px rgba(200, 175, 145, 0.8),
                0 0 100px rgba(180, 155, 125, 0.6),
                0 0 150px rgba(160, 135, 105, 0.4),
                inset 0 0 50px rgba(255, 250, 240, 0.5);
            transform: translate(-50%, -50%) scale(0);
            transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .transition-overlay.active::before {
            width: 300vmax;
            height: 300vmax;
            transform: translate(-50%, -50%) scale(1);
        }

        .transition-overlay::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, 
                rgba(255, 255, 255, 0.4) 0%,
                rgba(235, 220, 200, 0.3) 30%,
                transparent 60%);
            transform: translate(-50%, -50%) scale(0);
            transition: all 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            filter: blur(20px);
        }

        .transition-overlay.active::after {
            width: 200vmax;
            height: 200vmax;
            transform: translate(-50%, -50%) scale(1);
        }

        /* 크레마 텍스처 */
        @keyframes crema-texture {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .transition-overlay.active {
            animation: crema-texture 2s ease-in-out;
            background-image: 
                repeating-radial-gradient(circle at 20% 30%, 
                    transparent 0px, 
                    rgba(255, 250, 240, 0.03) 2px, 
                    transparent 4px),
                repeating-radial-gradient(circle at 80% 70%, 
                    transparent 0px, 
                    rgba(200, 180, 160, 0.02) 3px, 
                    transparent 6px);
            background-size: 50px 50px, 80px 80px;
        }

        /* 메인 컨테이너 */
        .container {
            position: relative;
            z-index: 10;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 헤더 */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: var(--coffee-dark);
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--coffee-medium);
            font-weight: 300;
        }

        /* 프로그레스 바 */
        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(161, 136, 127, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 40px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--coffee-medium), var(--coffee-dark));
            border-radius: 10px;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px rgba(109, 76, 65, 0.5);
        }

        .progress-text {
            text-align: center;
            margin-top: 10px;
            color: var(--coffee-medium);
            font-size: 0.9rem;
        }

        /* 질문 카드 */
        .question-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            animation: slide-in 0.5s ease;
        }

        @keyframes slide-in {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question-number {
            color: var(--coffee-light);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.5rem;
            color: var(--coffee-dark);
            font-weight: 600;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* 선택지 */
        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option {
            background: var(--foam);
            border: 2px solid transparent;
            border-radius: 15px;
            padding: 20px 25px;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><defs><radialGradient id="bean" cx="40%" cy="40%"><stop offset="0%" style="stop-color:%233E2723;stop-opacity:1" /><stop offset="50%" style="stop-color:%236D4C41;stop-opacity:1" /><stop offset="100%" style="stop-color:%232C1810;stop-opacity:1" /></radialGradient></defs><ellipse cx="16" cy="16" rx="10" ry="14" fill="url(%23bean)" /><path d="M 16 6 Q 18 16 16 26" stroke="%23D7CCC8" stroke-width="1.5" fill="none" opacity="0.6"/><ellipse cx="12" cy="10" rx="2" ry="3" fill="%234A352F" opacity="0.4"/><ellipse cx="20" cy="12" rx="1.5" ry="2" fill="%234A352F" opacity="0.3"/></svg>'), pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .option::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(215, 204, 200, 0.3), transparent);
            transition: left 0.5s;
        }

        .option:hover::before {
            left: 100%;
        }

        .option:hover {
            border-color: var(--coffee-light);
            transform: translateX(5px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .option.selected {
            background: var(--coffee-dark);
            border-color: var(--coffee-dark);
            color: white;
        }

        .option-emoji {
            font-size: 1.5rem;
            margin-right: 15px;
        }

        .option-text {
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* 버튼 */
        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><defs><radialGradient id="bean" cx="40%" cy="40%"><stop offset="0%" style="stop-color:%233E2723;stop-opacity:1" /><stop offset="50%" style="stop-color:%236D4C41;stop-opacity:1" /><stop offset="100%" style="stop-color:%232C1810;stop-opacity:1" /></radialGradient></defs><ellipse cx="16" cy="16" rx="10" ry="14" fill="url(%23bean)" /><path d="M 16 6 Q 18 16 16 26" stroke="%23D7CCC8" stroke-width="1.5" fill="none" opacity="0.6"/><ellipse cx="12" cy="10" rx="2" ry="3" fill="%234A352F" opacity="0.4"/><ellipse cx="20" cy="12" rx="1.5" ry="2" fill="%234A352F" opacity="0.3"/></svg>'), pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .btn-primary {
            background: var(--coffee-dark);
            color: white;
            box-shadow: 0 5px 20px rgba(62, 39, 35, 0.3);
        }

        .btn-primary:hover {
            background: var(--coffee-medium);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(62, 39, 35, 0.4);
        }

        .btn-secondary {
            background: var(--accent);
            color: var(--coffee-dark);
        }

        .btn-secondary:hover {
            background: var(--coffee-light);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 결과 페이지 */
        .result-card {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            animation: slide-in 0.5s ease;
        }

        .result-icon {
            font-size: 5rem;
            margin-bottom: 20px;
        }

        .result-title {
            font-family: 'Playfair Display', serif;

        }

        .result-subtitle {
            font-size: 1.2rem;

        }

            color: var(--coffee-medium);

        }

        .tags {

        }

        .tag {

        }

        .brewing-tip {
            background: var(--foam);

        .brewing-tip-title {
            font-weight: 600;
            color: var(--coffee-dark);

        }

        }

        /* 히든 */

        /* 반응형 */
        @media (max-width: 768px) {

    </style>
</head>
<body>
    <!-- 인트로 화면 -->
    <div class="intro-screen" id="introScreen">
        <div class="intro-content">
            <div class="intro-title">☕</div>
            <h1 class="intro-title">나만의 커피 원두 찾기</h1>
            <p class="intro-subtitle">5가지 질문으로 당신의 취향을 분석하고<br>완벽한 원두를 추천해드립니다</p>
            <button class="intro-btn" onclick="startTest()">테스트 시작하기</button>
        </div>
    </div>

    <!-- 크레마 거품 배경 -->
    <div class="crema-background" id="cremaBackground"></div>
    
    <!-- 페이지 전환 효과 -->
    <div class="transition-overlay" id="transitionOverlay"></div>

    <div class="container">
        <!-- 헤더 -->
        <div class="header">
            <div class="logo">☕</div>
            <div class="subtitle">나만의 커피 원두 찾기</div>
        </div>

        <!-- 프로그레스 바 -->
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-text" id="progressText">1 / 5</div>

        <!-- 질문 영역 -->
        <div id="questionArea"></div>

        <!-- 버튼 -->
        <div class="btn-container">
            <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()">이전</button>
            <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>다음</button>
        </div>

        <!-- 결과 영역 (처음엔 숨김) -->
        <div id="resultArea" class="hidden"></div>
    </div>

    <script>
        // 질문 데이터
        const questions = [
            {
                number: "Q1",
                text: "커피를 마실 때 선호하는 향미 느낌은?",

        // 원두 데이터베이스
        const coffeeBeans = [
            {

                match: { acidity: "balanced", body: "medium", method: ["drip", "espresso"], roast: "medium", caffeine: ["high", "medium"] }
            },
            {

                icon: "🍫",
                subtitle: "스모키하고 묵직한 카카오 향",
                description: "화산재 토양에서 자란 강렬한 풍미의 원두입니다. 진한 초콜릿과 스모키한 향, 묵직한 바디감이 특징이며 라떼나 에스프레소로 최적입니다.",
                tags: ["#카카오", "#스모키", "#진함", "#묵직함"],
                brewing: "에스프레소/라떼 | 92-94°C | 1:2 비율 | 25-30초 추출",
                match: { acidity: "bold", body: "heavy", method: ["espresso", "cold"], roast: "dark", caffeine: ["high", "medium"] }
            },
            {

                icon: "🥜",

                description: "낮은 산미와 부드러운 바디감, 고소한 땅콩과 캐러멜 향이 특징입니다. 누구나 부담없이 즐길 수 있으며, 우유와의 궁합이 뛰어납니다.",
                tags: ["#땅콩", "#캐러멜", "#부드러움", "#고소함"],
                brewing: "드립/콜드브루 | 88°C | 1:17 비율 | 우유 조합 추천",

            },
            {

                description: "화학 약품 없이 물만으로 카페인을 제거한 건강한 디카페인입니다. 군고구마와 초콜릿의 달콤함이 특징이며, 밤에도 부담없이 즐길 수 있습니다.",
                tags: ["#디카페인", "#군고구마", "#초콜릿", "#건강"],

                description: "독특한 습식 가공법으로 만들어진 개성 강한 원두입니다. 허브, 삼나무, 흙의 향과 묵직한 바디감이 특징이며, 깊은 맛을 좋아하는 분들께 추천합니다.",
                tags: ["#허브", "#흙", "#우디", "#개성"],
                brewing: "프렌치프레스 | 92°C | 1:14 비율 | 4분 침출",
                match: { acidity: "bold", body: "heavy", method: "drip", roast: "dark", caffeine: "high" }
            },
            {
                name: "코스타리카 따라주",
                icon: "🍯",
                subtitle: "꿀과 시트러스의 조화",
                description: "꿀의 달콤함과 오렌지의 상큼함이 절묘하게 균형잡힌 원두입니다. 깨끗한 맛과 부드러운 산미로 커피 입문자부터 마니아까지 모두 만족시킵니다.",
                tags: ["#꿀", "#오렌지", "#깔끔함", "#밸런스"],
                brewing: "드립 | 90°C | 1:16 비율 | 3분 추출",
                match: { acidity: ["bright", "balanced"], body: "light", method: "drip", roast: "light", caffeine: "medium" }
            }
        ];

        // 상태
        let currentQuestion = 0;
        let answers = {};

        // 인트로 화면에서 테스트 시작
        function startTest() {
            const intro = document.getElementById('introScreen');
            const overlay = document.getElementById('transitionOverlay');
            
            // 크레마 레이어 생성
            createCremaLayers(overlay);
            
            // 크레마 전환 효과 활성화
            overlay.classList.add('active');
            
            // 400ms 후 인트로 숨김
            setTimeout(() => {
                intro.classList.add('hidden');
            }, 400);
            
            // 1200ms 후 크레마 효과 제거 및 정리
            setTimeout(() => {
                overlay.classList.remove('active');
                setTimeout(() => {
                    overlay.innerHTML = ''; // 크레마 레이어 제거
                }, 300);
            }, 1200);
        }

        // 크레마 레이어 생성
        function createCremaLayers(container) {
            container.innerHTML = '';
            
            // 중심, 중간, 외곽 레이어
            const layers = ['center', 'middle', 'outer'];
            layers.forEach(layer => {
                const div = document.createElement('div');
                div.className = `crema-layer crema-${layer}`;
                container.appendChild(div);
            });
            
            // 입자 효과 (20개)
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'crema-particle';
                
                const size = Math.random() * 80 + 40;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                
                // 중앙에서 랜덤한 방향으로 퍼지기
                const angle = (Math.PI * 2 * i) / 20;
                const distance = Math.random() * 200 + 100;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                particle.style.top = '50%';
                particle.style.left = '50%';
                particle.style.animationDelay = (Math.random() * 0.3) + 's';
                
                container.appendChild(particle);
            }
        }

        // 초기화
        function init() {
            createBubbles();
            renderQuestion();
            updateProgress();
        }

        // 거품 생성 (더 많고 디테일하게)
        function createBubbles() {
            const container = document.getElementById('cremaBackground');
            for (let i = 0; i < 30; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                const size = Math.random() * 120 + 40;
                bubble.style.width = size + 'px';
                bubble.style.height = size + 'px';
                bubble.style.left = Math.random() * 100 + '%';
                bubble.style.animationDelay = Math.random() * 8 + 's';
                bubble.style.animationDuration = (Math.random() * 5 + 5) + 's';
                
                // 랜덤 투명도로 깊이감
                const opacity = 0.3 + Math.random() * 0.4;
                bubble.style.opacity = opacity;
                
                container.appendChild(bubble);
            }
        }

        // 질문 렌더링
        function renderQuestion() {
            const q = questions[currentQuestion];
            const html = `
                <div class="question-card">
                    <div class="question-number">${q.number}</div>
                    <div class="question-text">${q.text}</div>
                    <div class="options">
                        ${q.options.map((opt, idx) => `
                            <div class="option" onclick="selectOption(${idx}, '${opt.value}')">
                                <span class="option-emoji">${opt.emoji}</span>
                                <span class="option-text">${opt.text}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            document.getElementById('questionArea').innerHTML = html;

            // 이전 답변 복원
            if (answers[currentQuestion] !== undefined) {
                const options = document.querySelectorAll('.option');
                options[answers[currentQuestion].index].classList.add('selected');
                document.getElementById('nextBtn').disabled = false;
            }
        }

        // 선택
        function selectOption(index, value) {
            // 모든 선택 해제
            document.querySelectorAll('.option').forEach(opt => {
                opt.classList.remove('selected');
            });

            // 선택된 옵션 표시
            document.querySelectorAll('.option')[index].classList.add('selected');

            // 답변 저장
            answers[currentQuestion] = { index, value };

            // 다음 버튼 활성화
            document.getElementById('nextBtn').disabled = false;
        }

        // 다음 질문
        function nextQuestion() {
            if (answers[currentQuestion] === undefined) return;

            // 전환 효과
            triggerTransition();

            setTimeout(() => {
                currentQuestion++;

                if (currentQuestion >= questions.length) {
                    // 결과 계산
                    showResult();
                } else {
                    // 다음 질문
                    renderQuestion();
                    updateProgress();
                    updateButtons();
                }
            }, 800);
        }

        // 이전 질문
        function prevQuestion() {
            if (currentQuestion === 0) return;

            triggerTransition();

            setTimeout(() => {
                currentQuestion--;
                renderQuestion();
                updateProgress();
                updateButtons();
            }, 800);
        }

        // 전환 효과 트리거
        function triggerTransition() {
            const overlay = document.getElementById('transitionOverlay');
            
            // 크레마 레이어 생성
            createCremaLayers(overlay);
            
            overlay.classList.add('active');
            setTimeout(() => {
                overlay.classList.remove('active');
                setTimeout(() => {
                    overlay.innerHTML = ''; // 크레마 레이어 제거
                }, 300);
            }, 1200);
        }

        // 프로그레스 업데이트
        function updateProgress() {
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('progressText').textContent = `${currentQuestion + 1} / ${questions.length}`;
        }

        // 버튼 상태 업데이트
        function updateButtons() {
            document.getElementById('prevBtn').style.display = currentQuestion === 0 ? 'none' : 'inline-block';
            document.getElementById('nextBtn').disabled = answers[currentQuestion] === undefined;
        }

        // 결과 계산
        function calculateResult() {
            // 답변 추출
            const acidity = answers[0].value;
            const body = answers[1].value;
            const method = answers[2].value;
            const roast = answers[3].value;
            const caffeine = answers[4].value;

            // 매칭 점수 계산
            let bestMatch = null;
            let bestScore = 0;

            coffeeBeans.forEach(bean => {
                let score = 0;

                // 산미 매칭
                if (bean.match.acidity === acidity || 
                    (Array.isArray(bean.match.acidity) && bean.match.acidity.includes(acidity))) {
                    score += 3;
                }

                // 바디 매칭
                if (bean.match.body === body || 
                    (Array.isArray(bean.match.body) && bean.match.body.includes(body))) {
                    score += 2;
                }

                // 추출 방식 매칭
                if (bean.match.method === method || 
                    (Array.isArray(bean.match.method) && bean.match.method.includes(method))) {
                    score += 2;
                }

                // 로스팅 매칭
                if (bean.match.roast === roast) {
                    score += 2;
                }

                // 카페인 매칭
                if (bean.match.caffeine === caffeine || 
                    (Array.isArray(bean.match.caffeine) && bean.match.caffeine.includes(caffeine))) {
                    score += 1;
                }

                if (score > bestScore) {
                    bestScore = score;
                    bestMatch = bean;
                }
            });

            return bestMatch;
        }

        // 결과 표시
        function showResult() {
            const result = calculateResult();

            document.getElementById('questionArea').classList.add('hidden');
            document.querySelector('.progress-container').classList.add('hidden');
            document.querySelector('.progress-text').classList.add('hidden');
            document.querySelector('.btn-container').classList.add('hidden');

            const html = `
                <div class="result-card">
                    <div class="result-icon">${result.icon}</div>
                    <div class="result-title">${result.name}</div>
                    <div class="result-subtitle">${result.subtitle}</div>
                    
                    <div class="tags">
                        ${result.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                    
                    <div class="result-description">${result.description}</div>
                    
                    <div class="brewing-tip">
                        <div class="brewing-tip-title">☕ 추천 추출법</div>
                        <div class="brewing-tip-text">${result.brewing}</div>
                    </div>
                    
                    <div class="btn-container">
                        <button class="btn btn-secondary" onclick="shareResult()">결과 공유하기 📤</button>
                        <button class="btn btn-primary" onclick="restart()">다시 테스트 🔄</button>
                    </div>
                </div>
            `;

            document.getElementById('resultArea').innerHTML = html;
            document.getElementById('resultArea').classList.remove('hidden');
        }

        // 공유하기
        function shareResult() {
            const resultText = `나만의 커피 원두: ${document.querySelector('.result-title').textContent}\n${window.location.href}`;
            
            if (navigator.share) {
                navigator.share({
                    title: '나만의 커피 원두 찾기',
                    text: resultText,
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(resultText).then(() => {
                    alert('결과가 클립보드에 복사되었습니다! 📋');
                });
            }
        }

        // 재시작
        function restart() {
            currentQuestion = 0;
            answers = {};
            
            document.getElementById('resultArea').classList.add('hidden');
            document.getElementById('questionArea').classList.remove('hidden');
            document.querySelector('.progress-container').classList.remove('hidden');
            document.querySelector('.progress-text').classList.remove('hidden');
            document.querySelector('.btn-container').classList.remove('hidden');
            
            renderQuestion();
            updateProgress();
            updateButtons();
            
            triggerTransition();
        }

        // 초기 실행
        init();
    </script>
