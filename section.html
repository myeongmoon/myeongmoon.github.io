<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김밥 아카이브 - Kimbap Archive</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&family=Cute+Font&family=Gamja+Flower&family=Bagel+Fat+One&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0D0D0E;
            --bg-card: rgba(255, 255, 255, 0.05);
            --accent: #E3FF00;
            --text-white: #FFFFFF;
            --text-gray: #A0A0A0;
            --glass-bg: rgba(26, 26, 28, 0.8);
        }

        body {
            background: var(--bg-dark);
            color: var(--text-white);
            font-family: 'Jua', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            backdrop-filter: blur(20px);
            background: var(--glass-bg);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            padding: 20px 40px;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Bagel Fat One', cursive;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .logo span {
            color: var(--accent);
        }

        .subtitle {
            font-size: 0.75rem;
            color: var(--text-gray);
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 10px 20px;
            width: 300px;
        }

        .search-bar input {
            background: none;
            border: none;
            outline: none;
            color: var(--text-white);
            width: 100%;
            font-size: 0.9rem;
        }

        .search-bar input::placeholder {
            color: var(--text-gray);
        }

        /* Hero Section */
        .hero {
            margin-top: 100px;
            padding: 80px 40px;
            text-align: center;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero h1 {
            font-family: 'Jua', cursive;
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .hero .highlight {
            color: var(--accent);
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-gray);
            margin-bottom: 40px;
            letter-spacing: 0.5px;
        }

        /* Filter Chips */
        .filter-section {
            padding: 30px 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .filter-chips {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .chip {
            padding: 10px 24px;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .chip:hover, .chip.active {
            background: var(--accent);
            color: var(--bg-dark);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        /* Grid */
        .grid-container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 40px;
        }

        .masonry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        /* Card */
        .card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(227, 255, 0, 0.2);
            border-color: var(--accent);
        }

        .card-image-container {
            position: relative;
            overflow: hidden;
            aspect-ratio: 4/5;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .card:hover .card-image {
            transform: scale(1.1);
        }

        .slice-line {
            position: absolute;
            top: 0;
            left: -100%;
            width: 3px;
            height: 100%;
            background: var(--accent);
            box-shadow: 0 0 20px var(--accent);
            transition: left 0.6s ease;
        }

        .card:hover .slice-line {
            left: 100%;
        }

        .card-content {
            padding: 20px;
        }

        .card-number {
            font-size: 0.75rem;
            color: var(--accent);
            font-weight: 700;
            letter-spacing: 2px;
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 8px 0;
            font-family: 'Jua', cursive;
        }

        .card-tags {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.7rem;
            padding: 4px 12px;
            background: rgba(227, 255, 0, 0.1);
            color: var(--accent);
            border-radius: 12px;
            border: 1px solid rgba(227, 255, 0, 0.3);
        }

        .like-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .like-btn:hover {
            background: var(--accent);
            transform: scale(1.1);
        }

        .like-btn.liked {
            background: var(--accent);
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 40px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--glass-bg);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            max-width: 1200px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 40px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-white);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: var(--accent);
            color: var(--bg-dark);
        }

        .modal-split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 40px;
        }

        .modal-image {
            width: 100%;
            border-radius: 12px;
            aspect-ratio: 4/5;
            object-fit: cover;
        }

        .modal-info h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-family: 'Jua', cursive;
        }

        .modal-description {
            color: var(--text-gray);
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .color-palette {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .color-swatch {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .color-swatch:hover {
            transform: scale(1.2);
        }

        /* Submit Button */
        .submit-btn {
            position: fixed;
            bottom: 40px;
            right: 40px;
            background: var(--accent);
            color: var(--bg-dark);
            padding: 16px 32px;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(227, 255, 0, 0.4);
            transition: all 0.3s ease;
            border: none;
            font-size: 1rem;
            z-index: 999;
        }

        .submit-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 50px rgba(227, 255, 0, 0.6);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }

            .masonry-grid {
                grid-template-columns: 1fr;
            }

            .modal-split {
                grid-template-columns: 1fr;
            }

            .search-bar {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-content">
            <div>
                <div class="logo">김밥<span>.</span></div>
                <div class="subtitle">KIMBAP ARCHIVE</div>
            </div>
            <div class="search-bar">
                <input type="text" placeholder="Search cross-sections..." id="searchInput">
            </div>
        </div>
    </header>

    <!-- Hero -->
    <section class="hero">
        <h1>김밥처럼 보이는 <span class="highlight">세상의 모든 단면</span></h1>
        <p>From Kimbap to Everything: A Visual Journey Through Cross-Sections</p>
    </section>

    <!-- Filters -->
    <section class="filter-section">
        <div class="filter-chips">
            <div class="chip active" data-category="all">All</div>
            <div class="chip" data-category="food">🍱 Food</div>
            <div class="chip" data-category="nature">🌲 Nature</div>
            <div class="chip" data-category="body">💪 Body</div>
            <div class="chip" data-category="art">🎨 Art</div>
        </div>
    </section>

    <!-- Grid -->
    <section class="grid-container">
        <div class="masonry-grid" id="grid"></div>
    </section>

    <!-- Submit Button -->
    <button class="submit-btn" onclick="alert('김밥같은 단면 사진을 제보해주세요! 📸')">
        + 단면 제보하기
    </button>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="close-btn" onclick="closeModal()">×</div>
            <div class="modal-split">
                <div>
                    <h3 style="margin-bottom: 12px; color: var(--text-gray); font-size: 0.9rem;">Full Object</h3>
                    <img class="modal-image" id="modalImageFull" src="" alt="">
                </div>
                <div>
                    <h3 style="margin-bottom: 12px; color: var(--text-gray); font-size: 0.9rem;">Cross-Section</h3>
                    <img class="modal-image" id="modalImageSection" src="" alt="">
                </div>
            </div>
            <div class="modal-info">
                <h2 id="modalTitle"></h2>
                <p class="modal-description" id="modalDescription"></p>
                <div style="margin-top: 20px;">
                    <strong style="color: var(--accent);">Color Palette:</strong>
                    <div class="color-palette" id="colorPalette"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mock Data
        const sections = [
            {
                id: 1,
                number: '001',
                title: '김밥 (Kimbap)',
                category: 'food',
                tags: ['Korean', 'Rice', 'Origin'],
                description: '김밥 아카이브의 시작점. 완벽하게 말린 김밥의 단면은 흰 쌀, 노란 단무지, 주황 당근, 초록 시금치가 동심원을 이루며 아름다운 패턴을 만듭니다. 각각의 재료가 자신만의 색과 질감으로 하나의 작품을 완성합니다.',
                imageFull: 'kimbap-real.webp',
                imageSection: 'kimbap-real.webp',
                colors: ['#FFFFFF', '#FFD700', '#FF6347', '#228B22', '#1C1C1C']
            },
            {
                id: 2,
                number: '002',
                title: '나무의 나이테 (Tree Rings)',
                category: 'nature',
                tags: ['Nature', 'Time', 'Growth'],
                description: '수십 년의 시간이 새겨진 나무의 단면. 동심원으로 펼쳐지는 나이테는 마치 김밥의 층처럼 보입니다. 각 링은 1년의 성장을 의미하며, 넓은 링은 풍요로운 해를, 좁은 링은 가뭄의 해를 말해줍니다.',
                imageFull: 'kimbap-tree.jpg',
                imageSection: 'kimbap-tree.jpg',
                colors: ['#D2691E', '#8B4513', '#F4A460', '#CD853F', '#DEB887']
            },
            {
                id: 3,
                number: '003',
                title: '적양배추 (Red Cabbage)',
                category: 'food',
                tags: ['Vegetable', 'Purple', 'Organic'],
                description: '자연이 만든 프랙탈 패턴. 적양배추의 단면은 김밥처럼 중심에서 바깥으로 펼쳐지는 유기적 구조를 보여줍니다. 보라색과 흰색이 교차하며 만들어내는 자연의 기하학은 경이롭습니다.',
                imageFull: 'kimbap-cabbage.webp',
                imageSection: 'kimbap-cabbage.webp',
                colors: ['#800080', '#DDA0DD', '#FFFFFF', '#E6E6FA', '#8B008B']
            },
            {
                id: 4,
                number: '004',
                title: '허벅지 근육 단면 (Thigh Muscle)',
                category: 'body',
                tags: ['Anatomy', 'Muscle', 'Biology'],
                description: '인체의 경이로움. 허벅지를 가로로 자른 단면은 마치 김밥처럼 여러 근육 조직이 층을 이루며 배치되어 있습니다. 핑크색 근육 다발들이 노란 지방층과 흰 힘줄로 감싸여 있는 모습은 자연의 완벽한 설계를 보여줍니다.',
                imageFull: 'kimbap-thigh.webp',
                imageSection: 'kimbap-thigh.webp',
                colors: ['#FFB6C1', '#FF69B4', '#FFF8DC', '#F5DEB3', '#FFE4B5']
            },
            {
                id: 5,
                number: '005',
                title: '마블링 스톤 (Marble Stone)',
                category: 'art',
                tags: ['Marble', 'Geology', 'Pattern'],
                description: '수백만 년에 걸쳐 형성된 대리석의 단면. 마치 김밥의 재료들이 섞여 있는 것처럼, 갈색, 크림색, 흰색의 광물질들이 유기적으로 흐르며 자연의 추상화를 만들어냅니다. 각 층은 다른 지질학적 시대를 대표합니다.',
                imageFull: 'kimbap-marble.webp',
                imageSection: 'kimbap-marble.webp',
                colors: ['#8B4513', '#F5DEB3', '#FFFFFF', '#D2691E', '#A0826D']
            }
        ];

        let currentFilter = 'all';
        let likedItems = new Set();

        // Render Grid
        function renderGrid() {
            const grid = document.getElementById('grid');
            const filtered = currentFilter === 'all' 
                ? sections 
                : sections.filter(s => s.category === currentFilter);

            grid.innerHTML = filtered.map(section => `
                <div class="card" onclick="openModal(${section.id})">
                    <div class="card-image-container">
                        <img class="card-image" src="${section.imageSection}" alt="${section.title}">
                        <div class="slice-line"></div>
                        <div class="like-btn ${likedItems.has(section.id) ? 'liked' : ''}" 
                             onclick="event.stopPropagation(); toggleLike(${section.id})">
                            ${likedItems.has(section.id) ? '♥' : '♡'}
                        </div>
                    </div>
                    <div class="card-content">
                        <div class="card-number">${section.number}</div>
                        <div class="card-title">${section.title}</div>
                        <div class="card-tags">
                            ${section.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Filter
        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentFilter = chip.dataset.category;
                renderGrid();
            });
        });

        // Search
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                const title = card.querySelector('.card-title').textContent.toLowerCase();
                const tags = card.querySelector('.card-tags').textContent.toLowerCase();
                if (title.includes(query) || tags.includes(query)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        });

        // Like
        function toggleLike(id) {
            if (likedItems.has(id)) {
                likedItems.delete(id);
            } else {
                likedItems.add(id);
            }
            renderGrid();
        }

        // Modal
        function openModal(id) {
            const section = sections.find(s => s.id === id);
            if (!section) return;

            document.getElementById('modalImageFull').src = section.imageFull;
            document.getElementById('modalImageSection').src = section.imageSection;
            document.getElementById('modalTitle').textContent = section.title;
            document.getElementById('modalDescription').textContent = section.description;

            const paletteContainer = document.getElementById('colorPalette');
            paletteContainer.innerHTML = section.colors.map(color => 
                `<div class="color-swatch" style="background: ${color};" 
                      onclick="navigator.clipboard.writeText('${color}'); alert('Copied ${color}!')">
                </div>`
            ).join('');

            document.getElementById('modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Close modal on outside click
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') {
                closeModal();
            }
        });

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Initial render
        renderGrid();
    </script>
</body>
</html>
