<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEND.MACHINE - Digital Vending Experience</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-pink: #FF00FF;
            --neon-cyan: #00FFFF;
            --neon-yellow: #FFFF00;
            --dark-bg: #0A0A0F;
            --metal-gray: #2A2A35;
            --led-red: #FF0033;
            --screen-green: #00FF41;
        }

        body {
            background: var(--dark-bg);
            font-family: 'VT323', monospace;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* CRT 스캔라인 효과 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
            animation: scanline 8s linear infinite;
        }

        @keyframes scanline {
            0% { transform: translateY(0); }
            100% { transform: translateY(10px); }
        }

        /* 배경 그리드 */
        .background-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 0, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: grid-move 20s linear infinite;
            z-index: 0;
        }

        @keyframes grid-move {
            0% { transform: perspective(500px) rotateX(60deg) translateZ(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateZ(50px); }
        }

        /* 자판기 컨테이너 */
        .vending-machine {
            position: relative;
            width: 90vw;
            max-width: 900px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 
                0 0 60px rgba(255, 0, 255, 0.4),
                0 0 100px rgba(0, 255, 255, 0.3),
                inset 0 0 50px rgba(0, 0, 0, 0.5);
            border: 3px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        /* 헤더 */
        .machine-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255, 0, 255, 0.3);
        }

        .machine-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 2rem;
            color: var(--neon-cyan);
            text-shadow: 
                0 0 10px var(--neon-cyan),
                0 0 20px var(--neon-cyan),
                0 0 30px var(--neon-cyan);
            animation: flicker 3s infinite alternate;
            margin-bottom: 15px;
        }

        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                text-shadow: 
                    0 0 10px var(--neon-cyan),
                    0 0 20px var(--neon-cyan),
                    0 0 30px var(--neon-cyan);
            }
            20%, 24%, 55% {
                text-shadow: none;
            }
        }

        .machine-subtitle {
            font-size: 1.5rem;
            color: var(--neon-yellow);
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 49%, 100% { opacity: 1; }
            50%, 99% { opacity: 0.3; }
        }

        /* 디지털 디스플레이 */
        .digital-display {
            background: #000;
            border: 3px solid #333;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 
                inset 0 0 20px rgba(0, 255, 65, 0.3),
                0 0 20px rgba(0, 255, 65, 0.2);
        }

        .display-text {
            font-size: 1.8rem;
            color: var(--screen-green);
            text-align: center;
            text-shadow: 0 0 10px var(--screen-green);
            letter-spacing: 2px;
        }

        /* 슬롯 그리드 */
        .slots-container {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
        }

        .slots-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .slot {
            aspect-ratio: 1;
            background: linear-gradient(145deg, #1a1a2e, #0f0f1e);
            border: 3px solid #333;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .slot::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent 40%, rgba(255, 255, 255, 0.1) 50%, transparent 60%);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .slot:hover::before {
            transform: translateX(100%);
        }

        .slot:hover {
            transform: translateY(-5px) scale(1.05);
            border-color: var(--neon-cyan);
            box-shadow: 
                0 0 20px var(--neon-cyan),
                0 0 40px var(--neon-cyan),
                inset 0 0 20px rgba(0, 255, 255, 0.2);
        }

        .slot.selected {
            border-color: var(--neon-pink);
            animation: pulse 1s infinite;
            box-shadow: 
                0 0 30px var(--neon-pink),
                0 0 60px var(--neon-pink);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .slot.sold-out {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .slot.sold-out::after {
            content: 'SOLD OUT';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            color: var(--led-red);
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 0 0 10px var(--led-red);
            animation: blink 1s infinite;
        }

        .slot-code {
            font-size: 1.5rem;
            color: var(--neon-yellow);
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 5px var(--neon-yellow);
        }

        .slot-icon {
            font-size: 3rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 10px currentColor);
        }

        .slot-title {
            font-size: 1rem;
            color: #fff;
            text-align: center;
            padding: 0 10px;
        }

        .slot-price {
            font-size: 1.2rem;
            color: var(--neon-pink);
            margin-top: 5px;
        }

        /* 픽업존 */
        .pickup-zone {
            background: linear-gradient(180deg, #000 0%, #1a1a1a 100%);
            border: 3px solid #444;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 5px 20px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .pickup-zone::before {
            content: '↓ PICKUP ZONE ↓';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--dark-bg);
            padding: 5px 15px;
            color: var(--neon-yellow);
            font-size: 0.9rem;
            text-shadow: 0 0 5px var(--neon-yellow);
        }

        .pickup-item {
            font-size: 4rem;
            animation: drop 0.8s ease-out, wiggle 0.5s ease-in-out 0.8s;
        }

        @keyframes drop {
            0% { transform: translateY(-200px) rotate(0deg); opacity: 0; }
            60% { transform: translateY(10px) rotate(180deg); }
            80% { transform: translateY(-5px) rotate(360deg); }
            100% { transform: translateY(0) rotate(360deg); opacity: 1; }
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }

        .pickup-message {
            margin-top: 10px;
            color: var(--screen-green);
            font-size: 1.3rem;
        }

        /* 컨트롤 패널 */
        .control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            color: #fff;
        }

        .stat-icon {
            font-size: 2rem;
            filter: drop-shadow(0 0 5px currentColor);
        }

        .stat-value {
            color: var(--neon-cyan);
            font-weight: bold;
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        .reset-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, var(--neon-pink), var(--led-red));
            border: none;
            border-radius: 10px;
            color: #fff;
            font-family: 'VT323', monospace;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 0 0 20px var(--neon-pink);
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px var(--neon-pink), 0 0 50px var(--neon-pink);
        }

        .reset-btn:active {
            transform: scale(0.95);
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .vending-machine {
                padding: 20px;
            }

            .machine-title {
                font-size: 1.2rem;
            }

            .machine-subtitle {
                font-size: 1rem;
            }

            .slots-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .slot-icon {
                font-size: 2rem;
            }

            .slot-title {
                font-size: 0.8rem;
            }

            .control-panel {
                flex-direction: column;
                gap: 15px;
            }
        }

        /* 글리치 효과 */
        .glitch {
            animation: glitch 0.3s;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        /* 네온 라인 */
        .neon-line {
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                var(--neon-cyan) 50%, 
                transparent 100%);
            box-shadow: 0 0 10px var(--neon-cyan);
            margin: 20px 0;
            animation: neon-flow 2s linear infinite;
        }

        @keyframes neon-flow {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="background-grid"></div>
    
    <div class="vending-machine">
        <!-- 헤더 -->
        <div class="machine-header">
            <div class="machine-title">VEND.MACHINE</div>
            <div class="machine-subtitle">[ INSERT COIN TO CONTINUE ]</div>
        </div>

        <div class="neon-line"></div>

        <!-- 디지털 디스플레이 -->
        <div class="digital-display">
            <div class="display-text" id="displayText">WELCOME! SELECT YOUR ITEM...</div>
        </div>

        <!-- 슬롯 그리드 -->
        <div class="slots-container">
            <div class="slots-grid" id="slotsGrid"></div>
            
            <div class="neon-line"></div>

            <!-- 픽업존 -->
            <div class="pickup-zone" id="pickupZone">
                <div style="color: #666; font-size: 1.2rem;">Empty...</div>
            </div>
        </div>

        <!-- 컨트롤 패널 -->
        <div class="control-panel">
            <div class="stat">
                <span class="stat-icon">💰</span>
                <span>COINS: <span class="stat-value" id="coinsValue">5</span></span>
            </div>
            <div class="stat">
                <span class="stat-icon">🛒</span>
                <span>CART: <span class="stat-value" id="cartValue">0</span></span>
            </div>
            <button class="reset-btn" onclick="resetMachine()">🔄 RESET</button>
        </div>
    </div>

    <script>
        // 상품 데이터
        const products = [
            // A열 - Drinks (프로젝트)
            { code: 'A1', icon: '🥤', title: 'Cola Project', price: 1, category: 'drink', link: 'gallery.html' },
            { code: 'A2', icon: '🧃', title: 'Juice Work', price: 1, category: 'drink', link: 'umbrella.html' },
            { code: 'A3', icon: '🍵', title: 'Tea Portfolio', price: 1, category: 'drink', link: 'noise-rain.html' },
            { code: 'A4', icon: '☕', title: 'Coffee Art', price: 1, category: 'drink', link: 'pixel-umbrella.html' },
            
            // B열 - Snacks (미니 게임)
            { code: 'B1', icon: '🍫', title: 'Choco Game', price: 2, category: 'snack', link: 'chewing-simulator.html' },
            { code: 'B2', icon: '🍪', title: 'Cookie Click', price: 2, category: 'snack', link: 'diamond-skull.html' },
            { code: 'B3', icon: '🍿', title: 'Popcorn Fun', price: 2, category: 'snack', link: 'truman-escape.html' },
            { code: 'B4', icon: '🍩', title: 'Donut Rush', price: 2, category: 'snack', link: 'wind-umbrella.html' },
            
            // C열 - Mystery (랜덤)
            { code: 'C1', icon: '🎁', title: 'Mystery Box', price: 3, category: 'mystery', link: '#' },
            { code: 'C2', icon: '💎', title: 'Rare Item', price: 3, category: 'mystery', link: '#' },
            { code: 'C3', icon: '🎲', title: 'Lucky Draw', price: 3, category: 'mystery', link: '#' },
            { code: 'C4', icon: '✨', title: 'Special', price: 3, category: 'mystery', link: '#' },
            
            // D열 - Capsule (비하인드)
            { code: 'D1', icon: '💊', title: 'Behind Scene', price: 1, category: 'capsule', link: 'section.html' },
            { code: 'D2', icon: '🧬', title: 'Dev Log', price: 1, category: 'capsule', link: 'index.html' },
            { code: 'D3', icon: '🔬', title: 'Experiment', price: 1, category: 'capsule', link: '#' },
            { code: 'D4', icon: '🎯', title: 'Achievement', price: 1, category: 'capsule', link: '#' }
        ];

        let coins = 5;
        let cart = 0;
        let soldOut = new Set();

        // 초기화
        function init() {
            renderSlots();
            updateStats();
        }

        // 슬롯 렌더링
        function renderSlots() {
            const grid = document.getElementById('slotsGrid');
            grid.innerHTML = products.map(product => `
                <div class="slot ${soldOut.has(product.code) ? 'sold-out' : ''}" 
                     onclick="selectSlot('${product.code}')"
                     data-code="${product.code}">
                    <div class="slot-code">${product.code}</div>
                    <div class="slot-icon">${product.icon}</div>
                    <div class="slot-title">${product.title}</div>
                    <div class="slot-price">💰 ${product.price}</div>
                </div>
            `).join('');
        }

        // 슬롯 선택
        function selectSlot(code) {
            if (soldOut.has(code)) {
                playErrorSound();
                updateDisplay('❌ SOLD OUT!');
                glitchEffect();
                return;
            }

            const product = products.find(p => p.code === code);
            
            if (coins < product.price) {
                playErrorSound();
                updateDisplay('❌ INSUFFICIENT COINS!');
                glitchEffect();
                return;
            }

            // 코인 차감
            coins -= product.price;
            cart++;
            
            // 슬롯 선택 효과
            document.querySelectorAll('.slot').forEach(slot => {
                slot.classList.remove('selected');
            });
            document.querySelector(`[data-code="${code}"]`).classList.add('selected');

            // 디스플레이 업데이트
            updateDisplay(`✓ SELECTED: ${code} - ${product.title}`);

            // 픽업존에 상품 떨어트리기
            setTimeout(() => {
                dropItem(product);
                playSuccessSound();
            }, 500);

            // 랜덤으로 품절 처리 (30% 확률)
            if (Math.random() < 0.3) {
                soldOut.add(code);
                setTimeout(renderSlots, 1500);
            }

            updateStats();
        }

        // 상품 떨어트리기
        function dropItem(product) {
            const pickupZone = document.getElementById('pickupZone');
            pickupZone.innerHTML = `
                <div class="pickup-item">${product.icon}</div>
                <div class="pickup-message">🎉 ${product.title}</div>
            `;

            // 링크가 있으면 2초 후 이동
            if (product.link && product.link !== '#') {
                setTimeout(() => {
                    updateDisplay(`🚀 LOADING ${product.title.toUpperCase()}...`);
                    setTimeout(() => {
                        window.location.href = product.link;
                    }, 1000);
                }, 2000);
            }
        }

        // 디스플레이 업데이트
        function updateDisplay(text) {
            const display = document.getElementById('displayText');
            display.textContent = text;
        }

        // 통계 업데이트
        function updateStats() {
            document.getElementById('coinsValue').textContent = coins;
            document.getElementById('cartValue').textContent = cart;
        }

        // 글리치 효과
        function glitchEffect() {
            const machine = document.querySelector('.vending-machine');
            machine.classList.add('glitch');
            setTimeout(() => {
                machine.classList.remove('glitch');
            }, 300);
        }

        // 리셋
        function resetMachine() {
            coins = 5;
            cart = 0;
            soldOut.clear();
            document.getElementById('pickupZone').innerHTML = '<div style="color: #666; font-size: 1.2rem;">Empty...</div>';
            updateDisplay('🔄 MACHINE RESET! WELCOME BACK!');
            renderSlots();
            updateStats();
            playSuccessSound();
        }

        // 효과음 (Web Audio API)
        function playSuccessSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
        }

        function playErrorSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 200;
            oscillator.type = 'sawtooth';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.2);
        }

        // 코나미 코드 이스터에그
        let konamiCode = [];
        const konamiSequence = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];

        document.addEventListener('keydown', (e) => {
            konamiCode.push(e.key);
            konamiCode = konamiCode.slice(-10);
            
            if (konamiCode.join(',') === konamiSequence.join(',')) {
                activateSecretMode();
            }
        });

        function activateSecretMode() {
            coins += 99;
            updateStats();
            updateDisplay('🎮 KONAMI CODE ACTIVATED! +99 COINS!');
            glitchEffect();
            
            // 무지개 효과
            const machine = document.querySelector('.vending-machine');
            machine.style.animation = 'rainbow 2s linear infinite';
            setTimeout(() => {
                machine.style.animation = '';
            }, 5000);
        }

        // 더블클릭으로 흔들기
        document.querySelector('.vending-machine').addEventListener('dblclick', () => {
            const machine = document.querySelector('.vending-machine');
            machine.style.animation = 'shake 0.5s';
            setTimeout(() => {
                machine.style.animation = '';
            }, 500);
            
            // 랜덤으로 무료 코인
            if (Math.random() < 0.5) {
                coins += 1;
                updateStats();
                updateDisplay('🎰 SHAKE BONUS! +1 COIN!');
                playSuccessSound();
            }
        });

        // 흔들기 애니메이션
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
                20%, 40%, 60%, 80% { transform: translateX(5px); }
            }
            
            @keyframes rainbow {
                0% { filter: hue-rotate(0deg); }
                100% { filter: hue-rotate(360deg); }
            }
        `;
        document.head.appendChild(style);

        // 초기화 실행
        init();
    </script>
</body>
</html>
